name: Office Agent CI

on:
  push:
    branches: [ main, develop, 'codex/rc-*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Type check with mypy (blocking)
      if: matrix.python-version == '3.12'
      run: |
        mypy

    - name: Lint with ruff (advisory)
      run: |
        ruff check office_agent/ --select=E,F --ignore=E501 || true

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short -m "not slow"

    - name: Coverage report
      run: |
        python -m pytest tests/ --cov=office_agent --cov-report=xml --cov-report=term -m "not slow" || true

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.12'
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  release-chain:
    name: Blocking Windows release chain
    needs: test
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install production dependencies
      run: python -m pip install -r requirements-production.txt

    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.7.0

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: desktop-client/pnpm-lock.yaml

    - name: Install desktop dependencies
      run: pnpm --dir desktop-client install --frozen-lockfile

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Lint desktop frontend
      run: pnpm --dir desktop-client run lint

    - name: Type-check desktop frontend
      run: pnpm --dir desktop-client run typecheck

    - name: Test desktop frontend
      run: pnpm --dir desktop-client run test

    - name: Check Rust formatting
      working-directory: desktop-client/src-tauri
      run: cargo fmt -- --check

    - name: Build and verify Windows release chain
      shell: cmd
      run: desktop\build_windows.bat

    - name: Check Rust/Tauri
      working-directory: desktop-client/src-tauri
      run: cargo check --locked

    - name: Test Rust/Tauri
      working-directory: desktop-client/src-tauri
      run: cargo test --locked

    - name: Upload SHA-bound Windows RC artifacts
      uses: actions/upload-artifact@v4
      with:
        name: officeagent-windows-${{ github.sha }}
        if-no-files-found: error
        path: |
          desktop-client/src-tauri/target/release/bundle/nsis/*-setup.exe
          dist/OfficeAgent/release-manifest.json
