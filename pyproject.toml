[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "office-agent"
dynamic = ["version"]
description = "智能办公自动化助手（本地桌面版）—— Word 排版 / PPT 生成 / Excel 数据分析"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Web 框架
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
    "httpx>=0.24.0",
    # 数据层
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "aiosqlite>=0.19.0",
    # 配置
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    # Office 文件处理
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "PyMuPDF>=1.24.0",
    "Pillow>=10.0.0",
    "usearch>=2.26.0,<3",
    # 安全（API Key 本地加密）
    "cryptography>=41.0.0",
    # 工具
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5,<2",
]
semantic = [
    "sentence-transformers>=2.7.0",
]

# mypy config（2026-09-06 typing debt 已全量收敛至 0 errors，正式接入阻断式 CI）。
# 本配置不做任何错误抑制：无 disable_error_code、无全局 ignore_missing_imports、
# 不排除任何项目模块。唯一豁免：下列第三方库无高质量 stubs，仅豁免其 import 解析
# （narrowly scoped）。
[tool.mypy]
# python_version 固定 3.12：numpy 新版 stubs 使用 3.12 `type` 语句语法，3.10/3.11
# 解析即 syntax error 阻断全部检查；与 CI 矩阵最高版本一致。被检查代码语法兼容由
# requires-python>=3.10 约束。platform 固定 win32：Office Agent 为 Windows 桌面项目，
# ctypes.windll / msvcrt / subprocess.CREATE_NO_WINDOW 等为合法 Windows API，Linux CI
# 下须固定目标平台以与本地基线口径一致（否则出现 9 处平台误报）。
python_version = "3.12"
platform = "win32"
packages = ["office_agent", "desktop"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "pptx.*",
    "openpyxl.*",
    "docx.*",
    "PIL.*",
    "fitz.*",
    "yaml.*",
    "pandas.*",
    "psutil.*",
]
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["office_agent*"]

[tool.setuptools.dynamic]
version = {attr = "office_agent._version.__version__"}
