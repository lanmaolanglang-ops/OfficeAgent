[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "office-agent"
dynamic = ["version"]
description = "智能办公自动化助手（本地桌面版）—— Word 排版 / PPT 生成 / Excel 数据分析"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Web 框架
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
    "httpx>=0.24.0",
    # 数据层
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "aiosqlite>=0.19.0",
    # 配置
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    # Office 文件处理
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "PyMuPDF>=1.24.0",
    "Pillow>=10.0.0",
    "usearch>=2.26.0,<3",
    # 工具
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5,<2",
]
semantic = [
    "sentence-transformers>=2.7.0",
]

# mypy baseline config (2026-09-05 census: 736 errors / 91 files — 见外部清单
# "缺少类型检查在 CI 中拦截" 条目)。本配置不做任何错误抑制：
# 无 disable_error_code、无全局 ignore_missing_imports、不排除任何项目模块。
# 唯一豁免：下列第三方库无高质量 stubs，仅豁免其 import 解析（narrowly scoped）。
# 在存量 typing debt 收敛前，本配置不接入 CI（接入即永久失败）；
# 修复批次可直接以 `mypy` 无参运行复现 baseline。
[tool.mypy]
# 固定 3.12：numpy 新版 stubs 使用 3.12 `type` 语句语法，3.10/3.11 解析即 syntax error
# 阻断全部检查；与 CI 矩阵最高版本一致。被检查代码语法兼容由 requires-python>=3.10 约束。
python_version = "3.12"
packages = ["office_agent", "desktop"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "pptx.*",
    "openpyxl.*",
    "docx.*",
    "PIL.*",
    "fitz.*",
    "yaml.*",
    "pandas.*",
    "psutil.*",
]
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["office_agent*"]

[tool.setuptools.dynamic]
version = {attr = "office_agent._version.__version__"}
